name: Data sync issue
description: Report Plaid, SnapTrade, balance, transaction, or investment sync problems.
title: "[Data sync]: "
labels: ["area: data-sync", "needs: triage"]
body:
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Plaid
        - SnapTrade
        - Both
        - Not sure
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: What data is missing, stale, duplicated, or incorrect?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Account type, date range, or asset class affected. Redact account numbers and personally identifying details.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Relevant command output or logs with secrets and financial details removed.
      render: shell
