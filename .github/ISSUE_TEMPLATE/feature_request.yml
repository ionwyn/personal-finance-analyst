name: Feature request
description: Propose a new capability or workflow improvement.
title: "[Feature]: "
labels: ["type: feature", "needs: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What job should this help with?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, data, or UI you expect.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard
        - Transactions
        - Spending insights
        - Pay cycles
        - Investments
        - Plaid integration
        - SnapTrade integration
        - Settings
        - Other
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes, constraints, or examples
      description: Include mockups or links if helpful. Do not include private financial data.
